[build]
  command = "bun run generate"
  # On Netlify, Nuxt/Nitro auto-applies the Netlify preset and writes the static
  # site to dist/. Locally dist is a symlink to .output/public, so this works both ways.
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Let bun run better-sqlite3's native postinstall (Nuxt Content needs it at build).
  # Also declared in package.json "trustedDependencies".

# Nuxt (Nitro) writes the prerendered static site to dist/ when NITRO_PRESET=static.
[build.processing]
  skip_processing = false
